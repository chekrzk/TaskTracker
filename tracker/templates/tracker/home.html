{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Жир — управление командами и задачами</title>
    <link rel="stylesheet" href="{% static 'tracker/css/style.css' %}">
</head>
<body>
    <main class="welcome">
        <h1>Жир</h1>
        <p>Управление компаниями, продуктами, командами и задачами.</p>
        <p>Добро пожаловать, {{ user.get_full_name|default:user.username }}!</p>
        <p>Рабочая часть приложения находится в разработке.</p>
        <form method="post" action="{% url 'tracker:logout' %}">
            {% csrf_token %}
            <button type="submit">Выйти</button>
        </form>
    </main>
</body>
</html>
